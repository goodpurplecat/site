<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finspots | Entrar na Minha Área</title>
<meta name="description" content="Acesse sua Minha Área Finspots com um link enviado por email, sem senha.">
<link rel="icon" type="image/png" href="assets/img/finspots-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #071730;
    --quase-preto: #00031B;
    --laranja: #FF5500;
    --laranja-fraco: rgba(255,85,0,0.13);
    --branco: #FFFFFF;
    --suave: #A9B2D6;
    --fraco: #6B76A8;
    --borda: rgba(255,255,255,0.09);
    --verde: #2ECC71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    background-color: var(--azul); color: var(--branco);
    line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--laranja); outline-offset: 3px; }

  .wrap-estreito { max-width: 460px; margin: 0 auto; padding: 0 24px; }
  section { padding: 60px 0; }
  .central { text-align: center; }

  h1 { font-size: clamp(24px, 3.6vw, 30px); font-weight: 800; }
  p { color: var(--suave); font-size: 15px; }

  .btn {
    display: inline-block; font-family: inherit; font-size: 15px; font-weight: 600;
    text-decoration: none; padding: 15px 30px; border-radius: 10px; border: none; cursor: pointer; width: 100%;
  }
  .btn-primario { background: var(--laranja); color: var(--branco); }
  .btn-primario:disabled { background: var(--fraco); cursor: not-allowed; opacity: 0.6; }

  header { padding: 26px 0; text-align: center; }
  .logo { font-size: 21px; font-weight: 800; text-decoration: none; display: inline-block; }
  .logo img { height: 42px; }

  .campo-email { margin: 28px 0 20px; text-align: left; }
  .campo-email label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 6px; }
  .campo-email input {
    width: 100%; background: var(--quase-preto); border: 1px solid var(--borda); border-radius: 8px;
    padding: 12px 14px; color: var(--branco); font-family: inherit; font-size: 14px;
  }

  footer { padding: 30px 0; text-align: center; font-size: 12.5px; color: var(--fraco); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><img src="assets/img/finspots-logo.png" alt="Finspots"></a>
</header>

<section class="central">
  <div class="wrap-estreito">
    <h1>Entrar na Minha Área</h1>
    <p style="margin-top:10px;">Sem senha: digite seu email e a gente manda um link de acesso pra caixa de entrada.</p>

    <div class="campo-email">
      <label for="email-login">Seu email</label>
      <input type="email" id="email-login" placeholder="voce@email.com" autocomplete="email">
    </div>

    <button class="btn btn-primario" id="btn-enviar-link">Enviar link de acesso</button>
    <p id="mensagem-login" style="display:none; margin-top:16px; font-size:13.5px;"></p>

    <p style="margin-top:28px; font-size:13px;">Ainda não é cliente? <a href="index.html" style="color:var(--laranja); text-decoration:underline;">Conheça a Finspots</a></p>
    <p style="margin-top:10px; font-size:13px;">Ficou com dúvida? <a href="https://wa.me/5562996677168" target="_blank" rel="noopener" style="color:var(--laranja); text-decoration:underline;">Chama no WhatsApp</a></p>
  </div>
</section>

<footer>Finspots | Inteligência de Vendas e Finanças para E-commerce</footer>

<script>
  var API_URL = 'https://saf-production.up.railway.app';

  var input = document.getElementById('email-login');
  var btn = document.getElementById('btn-enviar-link');
  var msg = document.getElementById('mensagem-login');

  function emailValido(valor) {
    return valor.indexOf('@') > 0 && valor.lastIndexOf('.') > valor.indexOf('@');
  }

  function mostrarMensagem(texto, cor) {
    msg.textContent = texto;
    msg.style.color = cor;
    msg.style.display = 'block';
  }

  function enviarLink() {
    if (!emailValido(input.value)) {
      mostrarMensagem('Digite um email válido.', 'var(--laranja)');
      return;
    }

    btn.disabled = true;
    var textoOriginal = btn.textContent;
    btn.textContent = 'Enviando...';
    msg.style.display = 'none';

    fetch(API_URL + '/auth/solicitar-link?email=' + encodeURIComponent(input.value), { method: 'POST' })
      .then(function (resposta) {
        if (!resposta.ok) throw new Error('status ' + resposta.status);
        return resposta.json();
      })
      .then(function () {
        mostrarMensagem('Se esse email tiver uma conta, o link chegou na caixa de entrada. Pode fechar essa aba.', 'var(--verde)');
        btn.textContent = 'Link enviado';
      })
      .catch(function (erro) {
        console.error('Falha ao solicitar link de acesso:', erro);
        btn.disabled = false;
        btn.textContent = textoOriginal;
        mostrarMensagem('Não foi possível enviar o link agora. Tenta de novo em instantes, ou chama no WhatsApp se continuar.', 'var(--laranja)');
      });
  }

  btn.addEventListener('click', enviarLink);
  input.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') enviarLink();
  });
</script>

</body>
</html>
