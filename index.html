<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finspots | Diagnóstico Financeiro para E-commerce</title>
<link rel="icon" type="image/png" href="assets/img/finspots-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #04152e;
    --quase-preto: #00031B;
    --laranja: #FF5500;
    --laranja-fraco: rgba(255,85,0,0.13);
    --branco: #FFFFFF;
    --suave: #A9B2D6;
    --fraco: #6B76A8;
    --borda: rgba(255,255,255,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', system-ui, -apple-system, sans-serif;
    background-color: var(--azul);
    color: var(--branco);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  #bg-particulas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -1;
    pointer-events: none; filter: blur(1.5px);
  }

  a { color: inherit; }
  img { max-width: 100%; display: block; }

  :focus-visible { outline: 2px solid var(--laranja); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }
  .wrap-estreito { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  section { padding: 84px 0; }
  .bg-fundo { background: var(--quase-preto); }

  h2 {
    font-size: clamp(24px, 3.2vw, 32px);
    font-weight: 700;
    line-height: 1.3;
    color: #ff5400;
    text-shadow: 0 0 18px rgba(255,84,0,0.35);
  }

  .lead {
    font-size: clamp(19px, 2.6vw, 24px);
    font-weight: 700;
    line-height: 1.4;
  }

  p { color: var(--suave); font-size: 16px; }
  p + p { margin-top: 14px; }

  .central { text-align: center; }
  .central p { max-width: 560px; margin-left: auto; margin-right: auto; }

  .btn {
    display: inline-block;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    padding: 16px 32px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primario { background: var(--laranja); color: var(--branco); }
  .btn-secundario { background: transparent; color: var(--branco); border: 1.5px solid var(--borda); }

  .legenda {
    font-style: italic;
    color: var(--fraco);
    font-size: 13.5px;
    margin-top: 18px;
  }

  hr.linha { border: none; border-top: 1px solid var(--borda); margin: 0; }

  .kicker {
    color: var(--laranja); font-weight: 700; font-size: 13px;
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 12px;
  }
  .central .kicker { display: inline-block; }

  /* ---------- Cabeçalho ---------- */

  header { padding: 26px 0; }
  .header-inner { max-width: 1040px; margin: 0 auto; padding: 0 24px; width: 100%; display: flex; justify-content: space-between; align-items: center; }
  .nav-links { display: flex; gap: 26px; font-size: 14px; align-items: center; }
  .nav-links > a { text-decoration: none; color: var(--suave); }
  .nav-links > a:hover { color: var(--branco); }
  .logo img { height: 42px; display: block; }
  .nav-item-dropdown { position: relative; }
  .nav-item-dropdown > a { text-decoration: none; color: var(--suave); cursor: default; }
  .nav-item-dropdown:hover > a { color: var(--branco); }
  .dropdown-menu {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    background: var(--quase-preto); border: 1px solid var(--borda); border-radius: 10px;
    padding: 8px; min-width: 210px; opacity: 0; visibility: hidden;
    transition: opacity 0.15s ease; margin-top: 12px; text-align: left; z-index: 10;
  }
  .nav-item-dropdown:hover .dropdown-menu { opacity: 1; visibility: visible; }
  .dropdown-menu a { display: block; padding: 10px 14px; border-radius: 7px; font-size: 13.5px; white-space: nowrap; color: var(--suave); text-decoration: none; }
  .dropdown-menu a:hover { background: rgba(255,255,255,0.06); color: var(--branco); }
  .logo { font-size: 21px; font-weight: 800; letter-spacing: -0.3px; }
  .logo .spots { color: var(--laranja); }
  .logo .mira {
    display: inline-block; width: 0.6em; height: 0.6em;
    border-radius: 50%; border: 0.13em solid var(--laranja);
    position: relative; vertical-align: -0.02em;
  }
  .logo .mira::after {
    content: ""; position: absolute; inset: 0.16em;
    background: var(--laranja); border-radius: 50%;
  }

  /* ---------- Hero (imagem ao lado) ---------- */

  .hero { padding-top: 44px; }
  .hero .wrap {
    display: grid;
    grid-template-columns: 0.86fr 1.14fr;
    gap: 56px;
    align-items: center;
  }
  .hero h1 {
    font-size: clamp(30px, 4.6vw, 44px);
    font-weight: 800;
    line-height: 1.16;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .hero .subtitulo {
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 800;
    color: var(--laranja);
    margin-bottom: 22px;
  }
  .hero .lead { color: var(--branco); margin-bottom: 18px; }
  .hero p { margin-bottom: 4px; }
  .hero .cta-area { margin-top: 30px; }

  .hero-imagem {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    border: 1.5px solid var(--laranja);
    box-shadow: 0 0 32px rgba(255,85,0,0.28);
    aspect-ratio: 1 / 1;
  }
  .hero-imagem img { width: 100%; height: 100%; object-fit: cover; }
  .hero-badge {
    position: absolute;
    left: 20px; bottom: 20px;
    background: rgba(0,3,27,0.88);
    border-radius: 10px;
    padding: 12px 16px;
    backdrop-filter: blur(3px);
  }
  .hero-badge b { color: var(--laranja); font-size: 15px; display: block; }
  .hero-badge span { color: var(--suave); font-size: 11px; letter-spacing: 0.3px; }

  @media (max-width: 820px) {
    .hero .wrap { grid-template-columns: 1fr; }
    .hero-imagem { order: -1; aspect-ratio: 16/10; }
  }

  /* ---------- Placeholder genérico (vídeo / mockup) ---------- */

  .placeholder {
    background: var(--quase-preto);
    border: 1px dashed var(--borda);
    border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; color: var(--fraco); text-align: center; padding: 40px 20px;
  }
  .placeholder.video { aspect-ratio: 16/9; max-width: 720px; margin: 0 auto; }
  .play-icon {
    width: 52px; height: 52px; border-radius: 50%; background: var(--laranja);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .play-icon svg { width: 18px; height: 18px; fill: var(--branco); }
  .placeholder p { color: var(--fraco); font-size: 13px; max-width: 260px; }

  .grid-mockups {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin: 32px 0; max-width: 520px; margin-left: auto; margin-right: auto;
  }
  .grid-mockups .placeholder { aspect-ratio: 3/4; padding: 20px 14px; }
  @media (max-width: 560px) { .grid-mockups { grid-template-columns: 1fr; } }

  /* ---------- Ícones (lista com ícone + título + texto) ---------- */

  .icone {
    width: 42px; height: 42px; border-radius: 11px;
    background: var(--laranja-fraco); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .icone svg { width: 20px; height: 20px; stroke: var(--laranja); fill: none; stroke-width: 1.8; }

  .lista-icones { display: grid; gap: 30px; margin-top: 40px; }
  .item-icone { display: flex; gap: 18px; align-items: flex-start; }
  .item-icone h3 { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
  .item-icone p { font-size: 14.5px; }

  @media (min-width: 720px) {
    .lista-icones.duas-colunas { grid-template-columns: 1fr 1fr; column-gap: 40px; }
  }

  .categoria-label {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--fraco); font-weight: 700; margin-bottom: 6px;
  }
  .item-icone .sub-item { margin-top: 10px; }
  .item-icone .sub-item:first-of-type { margin-top: 0; }

  /* ---------- Passos numerados (só onde é sequência de verdade) ---------- */

  .passos { display: grid; gap: 36px; margin-top: 44px; }
  @media (min-width: 720px) { .passos { grid-template-columns: repeat(3, 1fr); } }
  .passo-num {
    width: 38px; height: 38px; border-radius: 50%; background: var(--laranja);
    color: var(--branco); font-weight: 700; font-size: 15px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
  }
  .passo h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
  .passo p { font-size: 14.5px; }
  .passo strong { color: var(--branco); }

  /* ---------- Listas de check ---------- */

  .lista-check { list-style: none; margin-top: 28px; display: grid; gap: 14px; }
  .lista-check.duas-colunas { grid-template-columns: 1fr; }
  @media (min-width: 640px) { .lista-check.duas-colunas { grid-template-columns: 1fr 1fr; } }
  .lista-check li { display: flex; gap: 12px; font-size: 15px; color: var(--suave); align-items: flex-start; }
  .check-marca {
    width: 20px; height: 20px; border-radius: 50%; background: var(--laranja-fraco);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .check-marca svg { width: 11px; height: 11px; stroke: var(--laranja); stroke-width: 3; fill: none; }

  /* ---------- Identificação ---------- */

  .lista-dores { list-style: none; margin: 32px 0; display: grid; gap: 14px; max-width: 600px; margin-left: auto; margin-right: auto; }
  .lista-dores li {
    font-weight: 600; font-size: 16px; color: var(--branco);
    border-left: 2px solid var(--laranja); padding: 4px 0 4px 16px; text-align: left;
  }

  /* ---------- Card de oferta ---------- */

  .card-oferta {
    max-width: 620px; margin: 40px auto 0;
    background: var(--quase-preto); border: 1.5px solid var(--laranja);
    border-radius: 18px; padding: 44px 40px;
  }
  .card-oferta h3 { font-size: 22px; font-weight: 700; margin-bottom: 14px; }
  .preco { font-size: 38px; font-weight: 800; margin-top: 18px; }
  .preco-nota { color: var(--fraco); font-size: 13.5px; margin-bottom: 8px; }
  .card-oferta .lista-check { margin-top: 26px; margin-bottom: 30px; }
  .garantia-nota {
    margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--borda);
    text-align: left;
  }
  .garantia-nota b { color: var(--branco); }

  /* ---------- FAQ ---------- */

  .faq { max-width: 680px; margin: 40px auto 0; }
  .faq details {
    border-bottom: 1px solid var(--borda); padding: 20px 0;
  }
  .faq summary {
    cursor: pointer; font-weight: 600; font-size: 16px; color: var(--branco);
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    list-style: none; text-align: left;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after {
    content: "+"; font-size: 22px; color: var(--laranja); flex-shrink: 0; font-weight: 400;
  }
  .faq details[open] summary::after { content: "–"; }
  .faq p { margin-top: 12px; font-size: 14.5px; text-align: left; }
  .faq .pendente { color: var(--laranja); font-style: italic; }

  /* ---------- Rodapé ---------- */

  footer { padding: 44px 0 36px; text-align: center; }
  footer .marca { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  footer .slogan { color: var(--fraco); font-size: 13.5px; margin-bottom: 18px; }
  footer .links { font-size: 13px; color: var(--fraco); }
  footer .links a { text-decoration: underline; text-underline-offset: 3px; }
  footer .links span { margin: 0 8px; }

  b, strong { color: var(--branco); font-weight: 700; }
</style>
</head>
<body>
<canvas id="bg-particulas"></canvas>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo"><img src="assets/img/finspots-logo.png" alt="Finspots"></a>
    <div class="nav-links">
      <a href="login.html">Já é cliente? Entrar</a>
    </div>
  </div>
</header>
